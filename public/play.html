<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="O'yinni brauzerda o'ynang — Game Host platformasi">
  <title>🎮 O'ynash — Game Host</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/enhance.css">
  <style>
    /* Player page — small-screen tweaks (page-specific only) */
    @media (max-width: 480px) {
      .player-toolbar { height: auto; min-height: 48px; padding: 6px var(--space-sm); gap: 4px; flex-wrap: wrap; }
      .player-toolbar-left { flex: 1; min-width: 0; }
      .player-toolbar-right { display: flex; align-items: center; gap: 4px; }
      .player-toolbar-right .lang-switcher { display: flex !important; padding: 2px; }
      .player-toolbar-right .lang-btn { padding: 3px 7px; font-size: 10px; min-height: 30px; }
      .toolbar-btn { width: 36px; height: 36px; }
      .player-toolbar-center { order: 3; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
      .player-toolbar-center::-webkit-scrollbar { display: none; }
      .resolution-selector { width: max-content; min-width: 100%; justify-content: center; }
      .res-btn { padding: 5px 8px; font-size: 11px; }
    }
    @media (max-width: 360px) {
      .back-btn span[data-i18n] { display: none; }
      .back-btn { padding: 6px 8px; }
      .player-game-title { font-size: 12px; max-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="player-page" id="player-page">

    <div class="player-toolbar" id="player-toolbar">
      <div class="player-toolbar-left">
        <a href="index.html" class="back-btn" id="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span data-i18n="player.back">Orqaga</span>
        </a>
        <span class="player-game-title" id="player-game-title">—</span>
      </div>

      <div class="player-toolbar-center">
        <div class="resolution-selector" id="resolution-selector">
          <button class="res-btn active" data-ratio="auto" title="Auto">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            <span>Auto</span>
          </button>
          <button class="res-btn" data-ratio="16:9" title="16:9 Landscape"><span class="res-preview landscape-16-9"></span><span>16:9</span></button>
          <button class="res-btn" data-ratio="9:16" title="9:16 Portrait"><span class="res-preview portrait-9-16"></span><span>9:16</span></button>
          <button class="res-btn" data-ratio="4:3" title="4:3 Tablet"><span class="res-preview landscape-4-3"></span><span>4:3</span></button>
          <button class="res-btn" data-ratio="3:4" title="3:4 Portrait Tablet"><span class="res-preview portrait-3-4"></span><span>3:4</span></button>
          <button class="res-btn" data-ratio="1:1" title="1:1 Square"><span class="res-preview square-1-1"></span><span>1:1</span></button>
          <button class="res-btn" data-ratio="21:9" title="21:9 Ultrawide"><span class="res-preview ultrawide"></span><span>21:9</span></button>
        </div>
      </div>

      <div class="player-toolbar-right">
        <div class="lang-switcher" id="player-lang-switcher">
          <button class="lang-btn active" data-lang="uz">UZ</button>
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <button class="toolbar-btn" id="btn-reload" title="Reload">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        </button>

        <button class="toolbar-btn" id="btn-fullscreen" title="Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>

    <div class="player-frame-wrapper" id="player-frame-wrapper">
      <div class="player-loading" id="player-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text" data-i18n="player.loading">O'yin yuklanmoqda...</div>
      </div>

      <div class="resolution-info" id="resolution-info">Auto</div>

      <div class="iframe-container" id="iframe-container">
        <!--
          Sandbox NOTE: Cocos Creator games use eval(), Web Workers,
          IndexedDB and other features that need allow-same-origin.
          Without it, the games fail to load with 'Unsafe attempt to
          load URL' errors.

          Security trade-off: when games are served from the SAME origin
          as this page, a malicious uploaded game could (with
          allow-same-origin) reach window.parent and read the admin token
          from localStorage. To get real isolation set the GAMES_BASE_URL
          env to a SEPARATE origin (e.g. https://games.example.com); the
          iframe then loads cross-origin and cannot touch this page at all.
          play.js builds the src from window.GH_RUNTIME.gamesBaseUrl.

          Additional same-origin mitigations:
            1. Private game folder names are unguessable (slug__token)
            2. Admin token key is obscure (gamehost_admin_token)
        -->
        <iframe class="player-iframe"
                id="game-iframe"
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads allow-pointer-lock allow-orientation-lock"
                allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>window.GAMES_CONFIG = [];</script>
  <script src="js/games-config.js"></script>
  <script src="js/runtime-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lib/util.js"></script>
  <script src="js/lib/escape.js"></script>
  <script src="js/lib/toast.js"></script>
  <script src="js/lib/auth.js"></script>
  <script src="js/lib/api.js"></script>
  <script src="js/pages/play.js"></script>
</body>
</html>
