<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="O'yinni brauzerda o'ynang — Game Host platformasi">
  <title>🎮 O'ynash — Game Host</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="player-page" id="player-page">

    <!-- ═══════════════ TOOLBAR ═══════════════ -->
    <div class="player-toolbar" id="player-toolbar">
      <div class="player-toolbar-left">
        <a href="index.html" class="back-btn" id="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span data-i18n="player.back">Orqaga</span>
        </a>
        <span class="player-game-title" id="player-game-title">—</span>
      </div>

      <div class="player-toolbar-center">
        <!-- Resolution / Aspect Ratio Selector -->
        <div class="resolution-selector" id="resolution-selector">
          <button class="res-btn active" data-ratio="auto" id="res-auto" title="Auto">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            <span>Auto</span>
          </button>
          <button class="res-btn" data-ratio="16:9" id="res-16-9" title="16:9 Landscape">
            <span class="res-preview landscape-16-9"></span>
            <span>16:9</span>
          </button>
          <button class="res-btn" data-ratio="9:16" id="res-9-16" title="9:16 Portrait">
            <span class="res-preview portrait-9-16"></span>
            <span>9:16</span>
          </button>
          <button class="res-btn" data-ratio="4:3" id="res-4-3" title="4:3 Tablet">
            <span class="res-preview landscape-4-3"></span>
            <span>4:3</span>
          </button>
          <button class="res-btn" data-ratio="3:4" id="res-3-4" title="3:4 Portrait Tablet">
            <span class="res-preview portrait-3-4"></span>
            <span>3:4</span>
          </button>
          <button class="res-btn" data-ratio="1:1" id="res-1-1" title="1:1 Square">
            <span class="res-preview square-1-1"></span>
            <span>1:1</span>
          </button>
          <button class="res-btn" data-ratio="21:9" id="res-21-9" title="21:9 Ultrawide">
            <span class="res-preview ultrawide"></span>
            <span>21:9</span>
          </button>
        </div>
      </div>

      <div class="player-toolbar-right">
        <!-- Language Switcher (compact) -->
        <div class="lang-switcher" id="player-lang-switcher">
          <button class="lang-btn active" data-lang="uz">UZ</button>
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <!-- Reload Button -->
        <button class="toolbar-btn" id="btn-reload" title="Reload">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
        </button>

        <!-- Fullscreen Button -->
        <button class="toolbar-btn" id="btn-fullscreen" title="Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ═══════════════ GAME FRAME ═══════════════ -->
    <div class="player-frame-wrapper" id="player-frame-wrapper">
      <!-- Loading Screen -->
      <div class="player-loading" id="player-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text" data-i18n="player.loading">O'yin yuklanmoqda...</div>
      </div>

      <!-- Resolution Info Badge -->
      <div class="resolution-info" id="resolution-info">Auto</div>

      <!-- Game iFrame Container (for aspect ratio) -->
      <div class="iframe-container" id="iframe-container">
        <iframe class="player-iframe"
                id="game-iframe"
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"
                allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/games-config.js"></script>
  <script>
    /* ============================================
       🎮 PLAYER PAGE LOGIC
       ============================================ */
    const Player = (() => {
      let currentGame = null;

      function init() {
        // Init i18n
        I18N.init();
        I18N.applyTranslations();

        // Setup lang switcher
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            I18N.setLang(btn.dataset.lang);
            if (currentGame) {
              updateTitle();
            }
          });
        });

        // Get game ID or private token from URL
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('game');
        const privateToken = params.get('token');

        if (privateToken) {
          // Private game — load from API via token
          loadPrivateGame(privateToken);
          return;
        }

        if (!gameId) {
          window.location.href = 'index.html';
          return;
        }

        // Find game config (public game)
        currentGame = GAMES_CONFIG.find(g => g.id === gameId);
        if (!currentGame) {
          window.location.href = 'index.html';
          return;
        }

        // Update title
        updateTitle();

        // Load game
        loadGame();

        // Setup controls
        setupControls();

        // Keyboard shortcuts
        setupKeyboardShortcuts();
      }

      async function loadPrivateGame(token) {
        try {
          const res = await fetch(`/api/games/private/${token}`);
          if (!res.ok) {
            document.getElementById('player-loading').innerHTML = `
              <div class="loading-text" style="color: #ef4444;">🔒 Maxfiy o'yin topilmadi yoki token noto'g'ri</div>
            `;
            return;
          }
          currentGame = await res.json();

          updateTitle();
          loadGame();
          setupControls();
          setupKeyboardShortcuts();
        } catch (err) {
          document.getElementById('player-loading').innerHTML = `
            <div class="loading-text" style="color: #ef4444;">Server bilan bog'lanib bo'lmadi</div>
          `;
        }
      }

      function setupKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            const page = document.getElementById('player-page');
            if (page.classList.contains('fullscreen')) {
              toggleFullscreen();
            } else {
              window.location.href = 'index.html';
            }
          }
          if (e.key === 'f' || e.key === 'F') {
            toggleFullscreen();
          }
        });
      }

      function updateTitle() {
        const title = I18N.localize(currentGame.name);
        document.getElementById('player-game-title').textContent = title;
        document.title = `🎮 ${title} — Game Host`;
      }

      function loadGame() {
        const iframe = document.getElementById('game-iframe');
        const loading = document.getElementById('player-loading');
        const gamePath = `games/${currentGame.folder}/index.html`;

        // Set iframe source
        iframe.src = gamePath;

        // Hide loading when iframe loads
        iframe.addEventListener('load', () => {
          setTimeout(() => {
            loading.classList.add('hidden');
          }, 500); // Small delay for smooth transition
        });

        iframe.addEventListener('error', () => {
          loading.innerHTML = `<div class="loading-text" style="color: #ef4444;">Xatolik: O'yin topilmadi!</div>`;
        });

        // Fallback: hide loading after 15s regardless
        setTimeout(() => {
          if (!loading.classList.contains('hidden')) {
            loading.innerHTML = `<div class="loading-text" style="color: #fbbf24;">O'yin yuklanishi sekin... Dastur qotgan bo'lishi mumkin.</div>`;
            setTimeout(() => loading.classList.add('hidden'), 5000);
          }
        }, 15000);
      }

      function setupControls() {
        // Reload button
        document.getElementById('btn-reload').addEventListener('click', () => {
          const iframe = document.getElementById('game-iframe');
          const loading = document.getElementById('player-loading');
          loading.classList.remove('hidden');
          iframe.src = iframe.src;
        });

        // Fullscreen button
        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

        // Resolution selector
        setupResolutionSelector();
      }

      function setupResolutionSelector() {
        const resButtons = document.querySelectorAll('.res-btn');
        const container = document.getElementById('iframe-container');
        const info = document.getElementById('resolution-info');

        const ratioMap = {
          'auto':  null,
          '16:9':  16 / 9,
          '9:16':  9 / 16,
          '4:3':   4 / 3,
          '3:4':   3 / 4,
          '1:1':   1,
          '21:9':  21 / 9,
        };

        resButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            const ratio = btn.dataset.ratio;

            // Update active state
            resButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Apply aspect ratio
            applyResolution(ratio, ratioMap[ratio]);

            // Show info badge
            showResolutionInfo(ratio);
          });
        });
      }

      function applyResolution(ratioName, ratioValue) {
        const container = document.getElementById('iframe-container');
        const wrapper = document.getElementById('player-frame-wrapper');

        // Reset
        container.style.width = '';
        container.style.height = '';
        container.style.maxWidth = '';
        container.style.maxHeight = '';
        container.style.aspectRatio = '';
        container.classList.remove('resolution-active');

        if (ratioName === 'auto' || !ratioValue) {
          // Full size — no constraints
          return;
        }

        container.classList.add('resolution-active');

        const wrapperRect = wrapper.getBoundingClientRect();
        const availW = wrapperRect.width;
        const availH = wrapperRect.height;

        // Calculate dimensions to fit within available space
        let w, h;
        if (ratioValue >= 1) {
          // Landscape or square
          h = availH * 0.95;
          w = h * ratioValue;
          if (w > availW * 0.95) {
            w = availW * 0.95;
            h = w / ratioValue;
          }
        } else {
          // Portrait
          h = availH * 0.95;
          w = h * ratioValue;
          if (w > availW * 0.95) {
            w = availW * 0.95;
            h = w / ratioValue;
          }
        }

        container.style.width = Math.round(w) + 'px';
        container.style.height = Math.round(h) + 'px';
      }

      function showResolutionInfo(ratio) {
        const info = document.getElementById('resolution-info');
        const labels = {
          'auto': 'Auto',
          '16:9': '16:9 Landscape',
          '9:16': '9:16 Portrait',
          '4:3': '4:3 Tablet',
          '3:4': '3:4 Portrait',
          '1:1': '1:1 Square',
          '21:9': '21:9 Ultrawide',
        };
        info.textContent = labels[ratio] || ratio;
        info.classList.add('visible');
        clearTimeout(info._timer);
        info._timer = setTimeout(() => info.classList.remove('visible'), 2000);
      }

      // Re-apply resolution on window resize
      window.addEventListener('resize', () => {
        const activeBtn = document.querySelector('.res-btn.active');
        if (activeBtn && activeBtn.dataset.ratio !== 'auto') {
          const ratioMap = { '16:9': 16/9, '9:16': 9/16, '4:3': 4/3, '3:4': 3/4, '1:1': 1, '21:9': 21/9 };
          applyResolution(activeBtn.dataset.ratio, ratioMap[activeBtn.dataset.ratio]);
        }
      });

      function toggleFullscreen() {
        const page = document.getElementById('player-page');
        const wrapper = document.getElementById('player-frame-wrapper');

        if (!document.fullscreenElement) {
          (wrapper.requestFullscreen || wrapper.webkitRequestFullscreen || wrapper.msRequestFullscreen).call(wrapper);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
        }
      }

      return { init };
    })();

    document.addEventListener('DOMContentLoaded', Player.init);
  </script>
</body>
</html>
